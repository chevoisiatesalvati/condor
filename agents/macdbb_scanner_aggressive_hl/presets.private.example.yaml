# Copy to strategies/{slug}/presets.yaml (private repo) or
# agents/{slug}/presets.private.yaml (gitignored local override).
labels:
  my_timeline_winner: My timeline winner
agent_strategy_preset_names:
  - my_timeline_winner
default_agent_strategy_preset: my_timeline_winner
current_winner_preset: my_timeline_winner
dynamic_preset_overrides:
  my_timeline_winner:
    replay_mode: timeline_backtest
    data_source: snapshots
    config_source: preset
    snapshot_dir: data/replay_snapshots_binance_1y
    enable_dynamic_sizing: true
    enable_dynamic_barriers: true
    sl_pct: 3.0
    tp_pct: 5.0
    max_open_executors: 5
